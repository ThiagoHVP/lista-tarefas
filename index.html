<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="Lista de tarefas simples, acessível e responsiva."
    />
    <title>Lista de Tarefas</title>
  </head>

  <body>
    <header class="site-header">
      <div class="container header-content">
        <div>
          <p class="eyebrow">Organização pessoal</p>
          <h1>Lista de Tarefas</h1>
        </div>

        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="Ativar modo escuro"
        >
          🌙
          <span>Modo escuro</span>
        </button>
      </div>
    </header>

    <main class="container">
      <section class="task-section" aria-labelledby="task-title">
        <h2 id="task-title">Minhas tarefas</h2>

        <form id="task-form" class="task-form">
          <label for="task-input">Nova tarefa</label>

          <div class="input-group">
            <input
              id="task-input"
              name="task"
              type="text"
              placeholder="Digite uma tarefa..."
              autocomplete="off"
              maxlength="100"
              required
            />

            <button type="submit">Adicionar tarefa</button>
          </div>
        </form>

        <div class="task-list-container">
          <div class="task-list-header">
            <h3>Tarefas</h3>
            <span id="task-count" aria-live="polite">0 tarefas</span>
          </div>

          <ul id="task-list" class="task-list" aria-label="Lista de tarefas">
            <!-- As tarefas serão inseridas pelo JavaScript -->
          </ul>

          <p id="empty-message" class="empty-message">
            Nenhuma tarefa adicionada ainda.
          </p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>Projeto Lista de Tarefas</p>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
